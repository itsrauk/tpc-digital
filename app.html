<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPC Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <!-- ─── Sidebar ─────────────────────────────────────────── -->
    <nav id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-name">TPC Digital</div>
        <div class="logo-tagline">Teatro Popular de Comedia</div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu</div>

        <div class="nav-item" data-view="dashboard">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="1" width="6" height="6" rx="1"/>
            <rect x="9" y="1" width="6" height="6" rx="1"/>
            <rect x="1" y="9" width="6" height="6" rx="1"/>
            <rect x="9" y="9" width="6" height="6" rx="1"/>
          </svg>
          Dashboard
        </div>

        <div class="nav-item" data-view="students" id="nav-students">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="5" r="3"/>
            <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
          </svg>
          Alunos
        </div>

        <div class="nav-item" data-view="courses" id="nav-courses">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="12" height="10" rx="1"/>
            <path d="M5 3V1M11 3V1M2 7h12"/>
          </svg>
          Turmas
        </div>

        <div class="nav-item" data-view="teachers" id="nav-teachers">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="6" cy="5" r="2.5"/>
            <path d="M1 14c0-2.8 2.2-5 5-5"/>
            <circle cx="12" cy="6" r="2"/>
            <path d="M9.5 14c0-2.2 1.1-3.8 2.5-4.5"/>
          </svg>
          Professores
        </div>

        <div class="nav-item" data-view="rooms" id="nav-rooms">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 14V6l6-4 6 4v8"/>
            <rect x="6" y="9" width="4" height="5" rx="0.5"/>
          </svg>
          Salas
        </div>

        <div class="nav-item" data-view="meetings" id="nav-meetings">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="3" width="14" height="11" rx="1"/>
            <path d="M5 1v4M11 1v4M1 7h14"/>
            <circle cx="5" cy="11" r="1" fill="currentColor"/>
            <circle cx="8" cy="11" r="1" fill="currentColor"/>
            <circle cx="11" cy="11" r="1" fill="currentColor"/>
          </svg>
          Reunioes
        </div>

        <div class="nav-item" data-view="history" id="nav-history">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="6"/>
            <path d="M8 5v3.5l2 2"/>
          </svg>
          Historico
        </div>

        <div class="nav-item" data-view="financial" id="nav-financial">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="4" width="12" height="9" rx="1"/>
            <path d="M5 4V2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V4"/>
            <path d="M5 8h6M5 11h4"/>
          </svg>
          Financeiro
        </div>

        <div class="nav-item" data-view="settings" id="nav-settings">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="2"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/>
          </svg>
          Configuracoes
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
        <button class="btn btn-secondary" id="btn-logout" style="width:100%; justify-content:center;">
          Sair
        </button>
      </div>
    </nav>

    <!-- ─── Overlay sidebar mobile ──────────────────────────── -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- ─── Main ─────────────────────────────────────────────── -->
    <main id="main">
      <header id="topbar">
        <button id="btn-sidebar-toggle" class="sidebar-toggle"
          onclick="toggleSidebar()" aria-label="Menu">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round">
            <path d="M3 5h14M3 10h14M3 15h14"/>
          </svg>
        </button>
        <span id="page-title">Dashboard</span>
        <div class="topbar-right">
          <!-- Busca global -->
          <div class="global-search-wrap" id="global-search-wrap">
            <button class="notif-btn" id="btn-search" onclick="GlobalSearch.toggle()" title="Buscar aluno">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="6.5" cy="6.5" r="4.5"/>
                <path d="M11 11l3 3"/>
              </svg>
            </button>
            <div class="global-search-panel" id="global-search-panel" style="display:none">
              <input type="text" id="global-search-input" class="input" placeholder="Buscar aluno por nome ou RA..."
                oninput="GlobalSearch.search(this.value)" autocomplete="off">
              <div id="global-search-results"></div>
            </div>
          </div>

          <button class="notif-btn" id="btn-notifications"
            onclick="NotificationsHelper.openPanel()" title="Notificacoes">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 1a5 5 0 0 1 5 5v3l1.5 2.5H1.5L3 9V6a5 5 0 0 1 5-5z"/>
              <path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/>
            </svg>
            <span id="notif-badge" class="notif-badge" style="display:none">0</span>
          </button>
        </div>
      </header>

      <div id="view-content">
        <div class="loading-state">Carregando...</div>
      </div>
    </main>

  </div>

  <!-- ─── Modal ──────────────────────────────────────────────── -->
  <div id="modal-overlay">
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button id="modal-close" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ─── Scripts ────────────────────────────────────────────── -->
  <!-- v23 — fix: professores veem chamada e frequencia nas turmas -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="js/config.js?v=23"></script>
  <script src="js/utils/helpers.js?v=23"></script>
  <script src="js/utils/pdf.js?v=23"></script>
  <script src="js/utils/audit.js?v=23"></script>
  <script src="js/utils/notifications.js?v=23"></script>
  <script src="js/auth.js?v=23"></script>
  <script src="js/modules/dashboard.js?v=23"></script>
  <script src="js/modules/students.js?v=23"></script>
  <script src="js/modules/courses.js?v=23"></script>
  <script src="js/modules/teachers.js?v=23"></script>
  <script src="js/modules/rooms.js?v=23"></script>
  <script src="js/modules/meetings.js?v=23"></script>
  <script src="js/modules/financial.js?v=23"></script>
  <script src="js/modules/history.js?v=23"></script>
  <script src="js/modules/settings.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
</body>
</html>
