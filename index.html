<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPC Digital - Acesso ao Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-btn-submit {
      width: 100%;
      height: 40px;
      background: var(--accent);
      color: #0d0d0d;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      border-radius: var(--radius);
      transition: background var(--transition);
      margin-top: 4px;
    }
    .login-btn-submit:hover:not(:disabled) { background: var(--accent-dark); }
    .login-btn-submit:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-name">TPC Digital</div>
        <div class="login-divider"></div>
        <div class="login-logo-sub">Teatro Popular de Comedia</div>
        <div class="login-logo-sub" style="margin-top:6px; font-size:10px; opacity:0.6;">Sistema de Gestao de Matriculas</div>
      </div>

      <form class="login-form" id="login-form">
        <div id="login-error" class="login-error">
          E-mail ou senha invalidos. Tente novamente.
        </div>

        <div class="login-form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="input" required
            autocomplete="email" placeholder="seu@email.com">
        </div>

        <div class="login-form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="input" required
            autocomplete="current-password" placeholder="Sua senha">
        </div>

        <button type="submit" class="login-btn-submit" id="login-btn">
          Entrar no Sistema
        </button>
      </form>

      <div class="login-footer">
        TPC Digital &mdash; Acesso restrito a usuarios autorizados
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        window.location.href = 'app.html';
        return;
      }

      const form = document.getElementById('login-form');
      const btn  = document.getElementById('login-btn');
      const err  = document.getElementById('login-error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Verificando...';

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const { data, error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'app.html';
        } catch {
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar no Sistema';
        }
      });
    });
  </script>
</body>
</html>
